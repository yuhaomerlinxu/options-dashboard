services:
  - type: web
    name: options-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DASH_TOKEN
        sync: false
      - key: USSTOCK_MCP_URL
        sync: false
      - key: USSTOCK_MCP_KEY
        sync: false
      - key: LONGBRIDGE_CLI_AUTH_B64
        sync: false
      - key: LONGBRIDGE_CLI_REGISTRATION_B64
        sync: false
      - key: LONGBRIDGE_DEVICE_ID
        sync: false
