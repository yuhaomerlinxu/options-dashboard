<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K线 · 关键位</title>
<style>body{margin:0;background:#0e1117;color:#d1d4dc;font:14px -apple-system,sans-serif}#top{padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input{width:90px;background:#1c2030;color:#fff;border:1px solid #333;border-radius:6px;padding:6px}button{background:#1c2030;color:#d1d4dc;border:1px solid #333;border-radius:6px;padding:6px 9px}button.on{background:#2962ff;color:#fff}
#hd{padding:0 8px;font-size:15px}#px{font-size:22px;font-weight:600}#c{width:100%;height:62vh}#lg{padding:8px;font-size:12px;line-height:1.6;color:#9aa}#lg b{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}a{color:#5b9cff}#err{color:#ff6b6b;padding:0 8px}</style></head>
<body><nav style="position:fixed;bottom:6px;left:8px;z-index:99;font:12px sans-serif;background:#111a;padding:3px 8px;border-radius:6px"><a href="/" style="color:#9cf;margin-right:10px">期权看板</a><a href="/qqq" style="color:#9cf;margin-right:10px">QQQ实时</a><a href="/qqq/chart?s=QQQ" style="color:#9cf;margin-right:10px">关键点位</a><a href="/qqq/radar" style="color:#fbbf24">期权雷达</a></nav><div id="top"><input id="sym" maxlength="10" placeholder="代码"><button id="go">查看</button>
<span id="qb"></span><span><button data-p="5m" class="pb on">5分钟</button><button data-p="15m" class="pb">15分钟</button></span> <a href="/qqq">← QQQ页</a> <a href="/qqq/radar" style="color:#fbbf24">📡 期权雷达</a></div>
<div id="hd"><span id="nm"></span> <span id="px">--</span> <span id="chg"></span> <span id="ext" style="color:#9aa;font-size:12px"></span></div><div id="err"></div>
<div id="c"></div><div id="sp" style="padding:8px;font-size:12px;line-height:1.5"></div><div id="sg" style="padding:8px;font-size:12px;line-height:1.6"></div><div id="lg"></div>
<script src="/qqq/static/lwc.js"></script><script>
const B='/qqq';
async function J(u){const r=await fetch(u,{cache:'no-store',headers:{'ngrok-skip-browser-warning':'1'}});const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('HTTP '+r.status+' 非JSON响应')}}const U=new URLSearchParams(location.search);let S=(U.get('s')||'QQQ').toUpperCase(),P=U.get('p')=='15m'?'15m':'5m';
['SPX','QQQ','SPY','NVDA','TSLA','AAPL','COHR'].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>setS(t);qb.appendChild(b)});
const ch=LightweightCharts.createChart(c,{layout:{background:{color:'#0e1117'},textColor:'#d1d4dc'},grid:{vertLines:{color:'#1a1e2a'},horzLines:{color:'#1a1e2a'}},timeScale:{timeVisible:true,secondsVisible:false,rightOffset:5},rightPriceScale:{scaleMargins:{top:.08,bottom:.22}},crosshair:{mode:0}});
const bg=ch.addHistogramSeries({priceScaleId:'bg',priceLineVisible:false,lastValueVisible:false});ch.priceScale('bg').applyOptions({scaleMargins:{top:0,bottom:0},visible:false});
const cs=ch.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
const vs=ch.addHistogramSeries({priceScaleId:'v',priceFormat:{type:'volume'},priceLineVisible:false,lastValueVisible:false});ch.priceScale('v').applyOptions({scaleMargins:{top:.82,bottom:0}});
new ResizeObserver(()=>ch.applyOptions({width:c.clientWidth,height:c.clientHeight})).observe(c);
const _f=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
function etOff(t){const p={};_f.formatToParts(new Date(t*1000)).forEach(x=>p[x.type]=x.value);return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-t*1000)/1000}
let lines=[],key='',fit=true;
function setS(t){t=t.toUpperCase().replace(/\.US$/,'');if(!/^[A-Z0-9.]{1,9}$/.test(t)){err.textContent='代码只能是字母/数字/点';return}S=t;key='';fit=true;history.replaceState(0,'','?s='+S+'&p='+P);load()}
go.onclick=()=>setS(sym.value);sym.onkeydown=e=>{if(e.key=='Enter')setS(sym.value)};
document.querySelectorAll('.pb').forEach(b=>b.onclick=()=>{P=b.dataset.p;document.querySelectorAll('.pb').forEach(x=>x.classList.toggle('on',x==b));fit=true;history.replaceState(0,'','?s='+S+'&p='+P);load()});
document.querySelectorAll('.pb').forEach(x=>x.classList.toggle('on',x.dataset.p==P));
function L(p,col,t,st){if(p==null)return;lines.push(cs.createPriceLine({price:p,color:col,lineWidth:st==3?1:1,lineStyle:st??2,axisLabelVisible:true,title:t+' - '+(+p).toFixed(2)}))}
async function load(){const s=S,p=P;sym.value=S;nm.textContent=S;
 try{const d=await J(B+'/candles?s='+s+'&p='+p);if(s!=S||p!=P)return;if(d.error){err.textContent=d.error;return}err.textContent='';
 const off=d.bars.length?etOff(d.bars[d.bars.length-1].t):0;
 cs.setData(d.bars.map(b=>({time:b.t+off,open:b.o,high:b.h,low:b.l,close:b.c,...(b.ext?{color:b.c>=b.o?'#1b6f67':'#8c3533',wickColor:'#666'}:{})})));
 vs.setData(d.bars.map(b=>({time:b.t+off,value:b.v,color:b.c>=b.o?'#26a69a66':'#ef535066'})));
 bg.setData(d.bars.map(b=>({time:b.t+off,value:1,color:b.ext?'rgba(120,120,160,0.10)':'rgba(0,0,0,0)'})));
 LV&&LV.k!=s&&(lines.forEach(l=>cs.removePriceLine(l)),lines=[]);if(fit){ch.timeScale().fitContent();fit=false}
 OFF=off;TS=new Set(d.bars.map(b=>b.t+off));loadSig(s);if(!SP||SP.symbol.replace(/\.US$/,'').replace(/^\./,'')!=s.replace(/^\./,''))slines.forEach(l=>cs.removePriceLine(l)),slines=[],SP=null;if(!SP)loadSp(s);else drawSp();SH=d.sess_high;SL=d.sess_low;if(!LV||LV.k!=s)lg.textContent='关键位计算中…（期权链首次约10-20秒）';else draw();loadLv(s);
 }catch(e){err.textContent='K线加载失败 '+e.message}}
let LV=null,SH,SL,OFF=0,SG=null;
let TS=new Set(),SP=null,slines=[],SHOW={7:true,10:true};
async function loadSig(s){try{const r=await J(B+'/signals?s='+s);if(s!=S||r.error)return;SG=r;
 const mk=r.signals.filter(x=>TS.has(x.t+OFF)).map(x=>({time:x.t+OFF,position:x.side=='B'?'belowBar':'aboveBar',color:x.side=='B'?'#00e676':'#ff1744',shape:x.side=='B'?'arrowUp':'arrowDown',text:x.label}));cs.setMarkers(mk);
 const st=r.stats||{};let h='<b>📍 入场信号（美股常规时段15分钟收盘K线；时间=北京时间）</b><br>';
 if(st.n)h+=`<span style="color:#888">回测(约7个月15m): ${st.n}次, 30分钟方向正确${(st.hit30*100).toFixed(0)}%, 60分钟${(st.hit60*100).toFixed(0)}%, 收盘${(st.hitc*100).toFixed(0)}%, 中位逆向${(+st.mae_med).toFixed(2)}ATR</span><br>`;
 if(!r.signals.length)h+='近期无信号<br>';
 r.signals.slice().reverse().slice(0,8).forEach(x=>{const k=x.strikes_rv;h+=`<span style="color:${x.side=='B'?'#00e676':'#ff5252'}">${x.side=='B'?'▲ Bull Put':'▼ Bear Call'}</span> 北京${x.time_bj} 价${x.price} ${x.held.join('/')} RSI${x.rsi} 卖腿(RV估算) 7天 ${k[7]} · 10天 ${k[10]}${x.today?' <b>今日</b>':' 当日收'+x.day_close}<br>`});
 sg.innerHTML=h}catch(e){}}
async function loadSp(s){try{const r=await J(B+'/spreads?s='+s);if(s!=S)return;if(r.pending||r.retry){sp.innerHTML='安全行权价计算中…（首次约15-40秒）';setTimeout(()=>loadSp(s),5000);return}if(r.error){sp.textContent='价差计算失败 '+r.error;return}SP=r;drawSp()}catch(e){sp.textContent='价差加载失败 '+e.message}}
function bk(x){return x.bucket}
function drawSp(){const r=SP;if(!r)return;slines.forEach(l=>cs.removePriceLine(l));slines=[];const f=r.proxy?r.ratio:1;
 const col={B:{7:'#00e676',10:'#2e7d32'},S:{7:'#ff1744',10:'#b71c1c'}},sty={7:0,10:2};
 r.spreads.forEach(x=>{const b=bk(x);if(!SHOW[b])return;['B','S'].forEach(sd=>{const y=x[sd];if(!y||y.error)return;const p=r.proxy?y.spx_short:y.short;
  slines.push(cs.createPriceLine({price:p,color:col[sd][b],lineWidth:b==7?2:1,lineStyle:sty[b],axisLabelVisible:true,title:(sd=='B'?'BPS ':'BCS ')+x.label+' 卖'+p}))})});
 const bi=r.bias||{},bc={bull:['#00e676','偏多→优先 Bull Put'],bear:['#ff5252','偏空→优先 Bear Call'],neutral:['#ffd600','中性→双边/铁鹰']}[bi.bias]||['#888','-'];
 let h=`<div style="margin:4px 0"><span style="background:${bc[0]};color:#000;border-radius:4px;padding:1px 6px">${bc[1]}</span> <span style="color:#888">${(bi.why||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span></div>`;
 h+=`<div>显示: ${[7,10].map(b=>`<label><input type="checkbox" ${SHOW[b]?'checked':''} onchange="SHOW[${b}]=this.checked;drawSp()">${b}天</label>`).join(' ')}</div>`;
 h+=`<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:11px;white-space:nowrap"><tr style="color:#888"><td>到期</td><td>类型</td><td>卖/买</td><td>Δ</td><td>触碰≈</td><td>收入 成交/理论</td><td>最大亏损</td><td>盈亏平衡</td><td>历史触碰/收盘破</td><td>信号后破(n)</td></tr>`;
 r.spreads.forEach(x=>['B','S'].forEach(sd=>{const y=x[sd];if(!y)return;if(y.error){h+=`<tr><td>${x.expiry.slice(5)} ${x.label}(${x.cal_days}日/${x.dte}交易日)</td><td>${sd=='B'?'BPS':'BCS'}</td><td colspan=8>${y.error}</td></tr>`;return}
  const ss=y.sig_hist;h+=`<tr style="border-top:1px solid #333"><td>${x.expiry.slice(5)} ${x.label}(${x.cal_days}日/${x.dte}交易日)</td><td style="color:${sd=='B'?'#00e676':'#ff5252'}">${sd=='B'?'BPS':'BCS'}</td><td>${r.proxy?`SPY ${y.short}/${y.long}<br>≈SPX ${y.spx_short}/${y.spx_long}`:y.short+'/'+y.long}</td><td>${y.delta}</td><td>${(y.touch_prob*100).toFixed(0)}%</td><td>${y.credit_last} / ${y.credit_theo}${y.low_credit?' <span style="color:#ffab00">⚠收入过低</span>':''}</td><td>$${y.max_loss}</td><td>${y.breakeven}</td><td>${y.hist_touch!=null?(y.hist_touch*100).toFixed(1)+'% / '+(y.hist_close*100).toFixed(1)+'%':'-'}</td><td>${ss?(ss[2]*100).toFixed(0)+'%('+ss[0]+')':'-'}</td></tr><tr><td></td><td colspan=9 style="color:#888">EM ±${x.em}×${x.mult} 线${y.em_line}, 关键位${y.key}; 止损: ${y.stop}</td></tr>`}));
 h+='</table></div>';
 h+=`<div style="color:#888">规则: 卖腿须同时在 7天/10天 ${r.spreads.map(x=>x.label+' '+x.mult+'×').join(', ')||'1.75×'} 预期波动(现价×ATM IV×√((当日剩余+剩余交易日)/252)) 之外, 且在关键位(前日低/今日低, Put墙; 看涨侧镜像)之外, 并 |Δ|≤0.10; 宽度 ${r.underlying=='SPY.US'||r.underlying=='QQQ.US'?3:5}。历史触碰/收盘破 = 约4年日线回测(7天≈5交易日, 10天≈7交易日)(20日实现波动作IV代理, 开盘入场)同规则的单侧比例。${r.proxy?'SPX无期权数据, 按SPY行权价×'+r.ratio+'换算, 建议用SPY/XSP交易。':''} ${r.session} · ${r.note} 更新 北京${r.time_bj}</div>`;
 sp.innerHTML=h}
async function loadLv(s){try{const v=await J(B+'/levels?s='+s);if(s!=S)return;if(v.pending||v.retry){if(v.retry)lg.textContent='关键位暂不可用，重试中… '+(v.error||'');setTimeout(()=>loadLv(s),4000);return}LV={k:s,v};draw()}catch(e){lg.textContent='关键位加载失败 '+e.message}}
function draw(){const d={sess_high:SH,sess_low:SL};
 lines.forEach(l=>cs.removePriceLine(l));lines=[];const v=LV.v||{};
 L(v.iv_p2,'#b388ff','隐含波动 +2σ');L(v.iv_p1,'#b388ff','隐含波动 +1σ');L(v.iv_m1,'#b388ff','隐含波动 -1σ');L(v.iv_m2,'#b388ff','隐含波动 -2σ');
 L(v.call_wall,'#ff4d4f','日内压力位',0);L(v.put_wall,'#26c281','日内支撑位',0);L(v.gamma_flip,'#ffd600','伽马场',0);L(v.max_pain,'#ffab00','多空分界线',1);
 L(d.sess_high,'#aaa','最高价',3);L(d.sess_low,'#aaa','最低价',3);
 let h='';if(v.proxy)h+=`<span style="color:#ffab00">⚠ SPX指数期权无数据，关键位${v.proxy}</span><br>`;if(v.has_options){h+=`<b style="background:#b388ff"></b>隐含波动 ±1σ/±2σ：参考价(${v.ref_name} ${v.ref})×ATM IV(${(v.atm_iv*100).toFixed(1)}%, 行权价${v.atm_strike}, ${v.expiries[0]})×√(1/252) = ±${v.move}<br>
 <b style="background:#ff4d4f"></b>日内压力位：现价上方 Call 持仓量最大行权价（${v.expiries.join('、')} 合计 OI ${v.call_wall_oi}）<br>
 <b style="background:#26c281"></b>日内支撑位：现价下方 Put 持仓量最大行权价（OI ${v.put_wall_oi}）<br>
 <b style="background:#ffd600"></b>伽马场：净GEX=Σ(Call OI−Put OI)×BS Gamma，扫描价格找正负翻转点${v.gamma_flip?'':'（未找到翻转，未画）'}；现价净GEX ${v.gex_spot}M<br>
 <b style="background:#ffab00"></b>多空分界线：${v.pivot_method||'-'}<br>`}else h+=(v.error?'关键位计算失败：'+v.error:'该代码无期权数据，仅显示K线。')+'<br>';
 h+='<b style="background:#aaa"></b>最高/最低价：最近常规交易时段（虚线）。灰底=盘前/盘后/夜盘。时间轴为美东时间。期权数据缓存5分钟，仅取±15%行权价、最近2个到期日。';lg.innerHTML=h;}
async function tick(){try{const d=await J(B+'/last?s='+S);if(d.error)return;px.textContent=(+d.last).toFixed(2);chg.textContent=d.chg+'%';chg.style.color=+d.chg>=0?'#26a69a':'#ef5350';
 ext.textContent=d.ext?({pre_market:'盘前',post_market:'盘后',overnight:'夜盘'}[d.ext.k])+' '+(+d.ext.last).toFixed(2):''}catch(e){}}
load();tick();setInterval(()=>{if(!window._lb){window._lb=1;Promise.resolve(load()).finally(()=>window._lb=0)}},1000);setInterval(()=>loadSp(S),120000);setInterval(tick,1000);
</script></body></html>
