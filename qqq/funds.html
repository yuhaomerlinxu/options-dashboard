<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>对冲基金新闻雷达</title>
<style>
:root{--bg:#070b14;--card:#101826;--card2:#0d1520;--line:#1c2a3d;--txt:#d7e0ee;--mut:#7d8b9d;--cyan:#5eead4;--cyan2:#22d3ee;--green:#34d399;--red:#fb7185;--amber:#fbbf24;--blue:#60a5fa;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;}
a{color:#9cd5ff;text-decoration:none}
#wrap{max-width:1180px;margin:0 auto;padding:12px 14px 88px;}
header.hero{text-align:center;padding:8px 0 10px}
header.hero h1{margin:0;font-size:28px;font-weight:750;letter-spacing:.08em;background:linear-gradient(180deg,#ecfeff,#5eead4 55%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(94,234,212,.35))}
#clocks{display:inline-flex;gap:16px;margin-top:8px;padding:6px 16px;border:1px solid var(--line);border-radius:10px;color:var(--mut);font-size:13px;background:#0a121c}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0}
.bar button{background:#155e75;border:1px solid #1e738a;color:var(--txt);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.bar select{background:#0a121c;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.note{font-size:12px;color:#8b9aab;line-height:1.55;background:#0c1420;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.sec{margin:16px 0}
.sec h2{margin:0 0 8px;font-size:20px;color:var(--cyan2);font-weight:700}
.sec .sub{color:var(--mut);font-size:12px;margin:0 0 10px}
.jud{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
@media(max-width:1100px){.jud{grid-template-columns:repeat(5,1fr)}}
@media(max-width:720px){.jud{grid-template-columns:repeat(3,1fr)}#wrap{padding:8px 8px 96px}header.hero h1{font-size:22px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;min-width:0}
.card h3{margin:0 0 4px;font-size:12px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.card .s{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.4}
.up{color:var(--green)} .dn{color:var(--red)} .mid{color:var(--amber)}
.upcard{background:#0d261c;border-color:#14532d}
.dncard{background:#2a1218;border-color:#7f1d1d}
.midcard{background:#1a1710;border-color:#3f3a1e}
.info{cursor:help;color:var(--cyan2);font-size:11px;border:1px solid #164e63;border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;position:relative}
.info span{display:none;position:absolute;z-index:20;left:0;top:18px;width:280px;background:#0b1220;border:1px solid var(--line);color:#cbd5e1;padding:8px;border-radius:8px;font-size:11px;font-weight:400;line-height:1.45;box-shadow:0 8px 24px #000a;text-align:left}
.info:hover span{display:block}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#1e293b;color:#94a3b8;margin-left:4px}
.news{display:flex;flex-direction:column;gap:0}
.ni{display:grid;grid-template-columns:96px 48px 1fr;gap:8px;align-items:start;padding:9px 4px;border-bottom:1px solid #1a2533;font-size:13px}
.ni .t{color:var(--mut);font-size:11px;line-height:1.35}
.ni .tag{font-size:11px;padding:1px 6px;border-radius:6px;background:#1e293b;color:#cbd5e1;text-align:center}
.tag.看多{background:#0d261c;color:#6ee7b7}
.tag.看空{background:#2a1218;color:#fda4af}
.tag.中性{background:#1e293b;color:#94a3b8}
#load{color:var(--mut);text-align:center;padding:40px 16px}
nav.bot{position:fixed;bottom:6px;left:8px;z-index:99;font:12px sans-serif;background:#111a;padding:3px 8px;border-radius:6px;max-width:calc(100% - 16px);overflow:auto;white-space:nowrap}
.muted{color:var(--mut)}
.drv{font-size:11px;color:#9fb0c3;margin-top:4px;line-height:1.4}
.drv a{color:#9fb0c3}
.flist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:720px){.flist{grid-template-columns:1fr}}
.frow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.frow .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.frow .nm{font-weight:650}
</style>
</head>
<body>
<nav class="bot">
<a href="/" style="color:#9cf;margin-right:10px">期权看板</a>
<a href="/qqq" style="color:#9cf;margin-right:10px">QQQ实时</a>
<a href="/qqq/chart?s=QQQ" style="color:#9cf;margin-right:10px">关键点位</a>
<a href="/qqq/radar" style="color:#fbbf24;margin-right:10px">期权雷达</a>
<a href="/echo?s=QQQ" style="color:#9cf;margin-right:10px">QQQ/SPX 5分</a>
<a href="/mbot?s=SPX" style="color:#9cf;margin-right:10px">mBOT 5分</a>
<a href="/strategy?symbol=QQQ" style="color:#9cf;margin-right:10px">策略雷达</a>
<a href="/strategy/fly?symbol=SPX" style="color:#9cf;margin-right:10px">蝶式雷达</a>
<a href="/funds" style="color:#fff">对冲基金</a>
</nav>
<div id="wrap">
  <header class="hero">
    <h1>对冲基金新闻雷达</h1>
    <div id="clocks"><span id="bj">北京：—</span><span id="et">美东：—</span></div>
  </header>
  <div class="bar">
    <button id="rf">刷新</button>
    <span class="muted" id="meta">正在准备新闻…</span>
  </div>
  <div id="load">正在抓取头部对冲基金近 7 天新闻，第一次大约半分钟…</div>
  <div id="app" style="display:none">
    <div class="note" id="notes"></div>
    <section class="sec" id="judge">
      <h2>七巨头与指数判断 <span class="info">ℹ<span id="tip"></span></span></h2>
      <p class="sub">只按近 7 天新闻的规则情绪打分，不是基金实时仓位。每张卡片显示看多 / 看空 / 中性条数，以及该标的最新一条新闻的北京时间。</p>
      <div class="jud" id="jud"></div>
    </section>
    <section class="sec" id="fundsec">
      <h2>按基金</h2>
      <p class="sub">近 7 天标题里提到该基金或经理的新闻条数，以及最新一条。</p>
      <div class="flist" id="flist"></div>
    </section>
    <section class="sec" id="newssec">
      <h2>每日新闻</h2>
      <p class="sub">Google News 与 CNBC 公开 RSS，英文标题原文 + 规则中文标签（看多 / 看空 / 中性）。时间是北京时间。</p>
      <div class="bar" style="margin-top:0">
        <label class="muted">基金</label>
        <select id="nf"><option value="">全部基金</option></select>
        <label class="muted">标的</label>
        <select id="nt"><option value="">全部标的</option>
          <option>AAPL</option><option>MSFT</option><option>NVDA</option><option>AMZN</option>
          <option>GOOGL</option><option>META</option><option>TSLA</option><option>QQQ</option><option>SPX</option>
        </select>
        <label class="muted">情绪</label>
        <select id="ng"><option value="">全部</option><option>看多</option><option>看空</option><option>中性</option></select>
      </div>
      <div class="news" id="news"></div>
    </section>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function tick(){
  const now=new Date();
  const f=(tz)=> new Intl.DateTimeFormat('sv-SE',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now).replace('T',' ');
  $('bj').textContent='北京：'+f('Asia/Shanghai');
  $('et').textContent='美东：'+f('America/New_York');
}
tick(); setInterval(tick,1000);
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const FUND_ZH = {};

let DATA=null, loading=false;
function render(d){
  DATA=d;
  (d.funds||[]).forEach(f=>{ FUND_ZH[f.id]=f.name_zh||f.name; });
  $('load').style.display='none';
  $('app').style.display='block';
  $('meta').textContent = '新闻刷新 '+(d.news_fetched||'—')+'　'+ (d.n_news||0) +' 条　'+ (d.n_funds||0) +' 家基金　约每 '+(d.ttl_min||20)+' 分钟更新';
  $('notes').innerHTML = esc(d.note||'') + (d.error? '<br>部分源拉取失败：'+esc(d.error):'');
  $('tip').textContent=d.formula||'';
  $('jud').innerHTML=(d.judgments||[]).map(j=>{
    const tone=j.tone==='up'?'upcard':(j.tone==='dn'?'dncard':'midcard');
    const drv=(j.drivers||[]).slice(0,3).map(x=>
      `<div><span class="tag ${esc(x.tag)}">${esc(x.tag)}</span> <a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a> <span class="muted">${esc(x.time_bj||'')}</span></div>`
    ).join('');
    return `<div class="card ${tone}">
      <h3>${esc(j.symbol)}${j.kind==='idx'?' <span class="badge">指数</span>':''}${j.thin?' <span class="badge">样本偏少</span>':''}</h3>
      <div class="v ${j.tone}">${esc(j.label)} <span style="font-size:16px">${j.score}</span></div>
      <div class="s">看多 ${j.news_bull}　看空 ${j.news_bear}　中性 ${j.news_neu}<br>相关 ${j.n} 条　最新 ${esc(j.latest_bj||'—')}</div>
      <div class="drv">${drv||'近 7 天没有对该标的的明确多空新闻'}</div>
    </div>`;
  }).join('');

  $('flist').innerHTML=(d.funds||[]).map(f=>
    `<div class="frow">
      <div class="hd"><div class="nm">${esc(f.name)} <span class="muted">${esc(f.name_zh||'')} · ${esc(f.people||'')}</span></div>
        <div class="muted">看多 ${f.news_bull}　看空 ${f.news_bear}　共 ${f.n}</div></div>
      <div class="muted" style="margin-top:4px">${f.latest_link? '<a href="'+esc(f.latest_link)+'" target="_blank" rel="noopener">'+esc(f.latest_title)+'</a>':'暂无相关新闻'}
        ${f.latest_bj? ' · '+esc(f.latest_bj):''} ${f.latest_tag? '<span class="tag '+esc(f.latest_tag)+'">'+esc(f.latest_tag)+'</span>':''}</div>
    </div>`
  ).join('');

  const nf=$('nf');
  const cur=nf.value;
  nf.innerHTML='<option value="">全部基金</option>'+(d.funds||[]).slice().sort((a,b)=>a.name.localeCompare(b.name)).map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');
  if(cur) nf.value=cur;
  renderNews();
}
function fundNames(ids){
  return (ids||[]).map(id=>FUND_ZH[id]||id).join(' ');
}
function tickerTagLine(n){
  const per=n.ticker_tags||{};
  const ticks=n.tickers||[];
  if(!ticks.length) return '';
  const parts=ticks.map(s=>{
    const tg=per[s];
    return tg && tg!=='中性' && tg!==n.tag ? (s+' '+tg) : s;
  });
  return parts.join(' ');
}
function renderNews(){
  if(!DATA) return;
  const fid=$('nf').value, tk=$('nt').value, tg=$('ng').value;
  const rows=(DATA.news||[]).filter(n=>{
    if(fid && !(n.funds||[]).includes(fid)) return false;
    if(tk && !(n.tickers||[]).includes(tk)) return false;
    if(tg && n.tag!==tg) return false;
    return true;
  }).slice(0,120);
  $('news').innerHTML=rows.map(n=>
    `<div class="ni"><div class="t">${esc(n.time_bj||'—')}</div>
     <div class="tag ${esc(n.tag)}">${esc(n.tag)}</div>
     <div><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
       <div class="muted">${esc(n.source||'')}　${tickerTagLine(n)}　${esc(fundNames(n.funds))}</div></div></div>`
  ).join('') || '<div class="muted" style="padding:12px">没有符合筛选的新闻。</div>';
}
$('nf').onchange=$('nt').onchange=$('ng').onchange=renderNews;

function load(){
  if(loading) return;
  loading=true;
  $('load').style.display='block';
  $('load').textContent='正在抓取新闻，请稍候…';
  fetch('/funds/data',{cache:'no-store'}).then(r=>r.json()).then(d=>{
    if(d.error && !d.news){ $('load').textContent='加载失败：'+d.error; loading=false; return; }
    render(d); loading=false;
  }).catch(e=>{ $('load').textContent='加载失败：'+e; loading=false; });
}
$('rf').onclick=()=>{ DATA=null; load(); };
load();
setInterval(()=>{ if(!loading) load(); }, 20*60*1000);
</script>
</body>
</html>
