<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQQ 实时</title>
<style>html,body{overflow-x:hidden;max-width:100vw}*{box-sizing:border-box}.card{overflow:hidden}pre{word-break:break-all}body{background:#0e1117;color:#e6e6e6;font-family:-apple-system,"PingFang SC",sans-serif;margin:0;padding:12px}

<script src="/qqq/static/lwc.js"></script>
<script>
let ctx=null,lastKey=null;const $=i=>document.getElementById(i);
$('snd').onclick=()=>{ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();beep();$('snd').textContent='🔊 声音已开启'};
function beep(){if(!ctx)return;for(let i=0;i<3;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);g.gain.value=.3;o.start(ctx.currentTime+i*.3);o.stop(ctx.currentTime+i*.3+.2)}}
const f=v=>v==null?'--':v,cls=v=>parseFloat(v)>=0?'up':'down';
function pct(l,p){if(!l||!p)return'';const c=(l-p)/p*100;return `<span class="${cls(c)}">${c>=0?'+':''}${c.toFixed(2)}%</span>`}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function opt(o){if(!o||typeof o!=='object')return'';return Object.entries(o).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span></div>`).join('')}
async function poll(){try{const r=await fetch(location.pathname.replace(/\/$/,'')+'/api',{cache:'no-store',headers:{'ngrok-skip-browser-warning':'1'}});const d=await r.json();const q=d.quote;
if(q){$('slab').textContent='QQQ '+(q.session_label||'');$('last').textContent=q.last;$('last').className='big '+cls(q.change_value);$('chg').innerHTML=`<span class="${cls(q.change_value)}">${q.change_value} (${q.change_percentage}%)</span>`;$('hi').textContent=q.high;$('lo').textContent=q.low;$('pc').textContent=q.prev_close;
let h='<b>延长时段</b>';[['pre_market','盘前'],['post_market','盘后'],['overnight','夜盘']].forEach(([k,n])=>{const x=q[k];if(x)h+=`<div class="row"><span>${n}</span><span>${x.last} ${pct(+x.last,+x.prev_close)}</span></div><div class="muted" style="text-align:right">高 ${x.high} / 低 ${x.low} · ${x.time_bj||''}</div>`});$('ext').innerHTML=h}
$('ts').textContent='数据时间（北京时间）：'+d.server_time_bj+(d.quote_error?' · 行情错误: '+d.quote_error:'');
const a=d.alerts||[];curAlerts=a;if(cs){setMarkers();liveBar(q)}renderSigs();if(a.length){const o=a[0].options_0dte;if(o){$('opt').style.display='';$('opt').innerHTML='<b>期权信息（0DTE，最新信号）</b>'+opt(o)}
}else if(lastKey===null)lastKey='';
}catch(e){$('ts').textContent='连接失败，重试中… '+e}}

const BASE=location.pathname.replace(/\/$/,''),OFF=8*3600,DEMO=new URLSearchParams(location.search).has('demo');
const MAC={9:'#3b82f6',21:'#a78bfa',50:'#f59e0b'},VWCOL='#9ca3af';
let ch,cs,vs,bg,em={},vw,curAlerts=[],kd=null,KL=[];
function etParts(ts){const p={};new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(ts*1000)).forEach(x=>p[x.type]=x.value);return {date:`${p.year}-${p.month}-${p.day}`,hm:(+p.hour%24)*60+(+p.minute)}}
function emaA(c,n){const k=2/(n+1),o=[];let e=null;c.forEach(x=>{e=e==null?x:x*k+e*(1-k);o.push(e)});return o}
function sessColor(ts){const hm=etParts(ts).hm;if(hm>=4*60&&hm<9*60+30)return 'rgba(232,210,160,0.14)';if(hm>=9*60+30&&hm<16*60)return 'rgba(170,160,230,0.13)';return 'rgba(0,0,0,0)'}
function fvgs(bars){const un=[],filled=[];
  for(let i=2;i<bars.length;i++){const a=bars[i-2],c=bars[i];let type=null,top,bot;
    if(a.h<c.l){type='bull';bot=a.h;top=c.l}else if(a.l>c.h){type='bear';top=a.l;bot=c.h}else continue;
    let end=null,mit=false;
    for(let j=i+1;j<bars.length;j++){const x=bars[j];if((type==='bull'&&x.l<=bot)||(type==='bear'&&x.h>=top)){end=x.t;mit=true;break}}
    (mit?filled:un).push({type,top,bot,t0:a.t,t1:end,mit})}
  return un.concat(filled.slice(-4))}
const OV={T:[],fv:[],lv:null,
  init(){ch.timeScale().subscribeVisibleLogicalRangeChange(()=>this.draw());new ResizeObserver(()=>this.draw()).observe($('chart'))},
  set(bars,lv){this.T=bars.map(b=>b.t+OFF);this.fv=fvgs(bars);this.lv=lv||{};requestAnimationFrame(()=>this.draw())},
  draw(){const cv=$('ovcv'),el=$('chart');if(!cv||!ch||!cs)return;const w=el.clientWidth,h=el.clientHeight,dp=window.devicePixelRatio||1;cv.width=w*dp;cv.height=h*dp;cv.style.width=w+'px';cv.style.height=h+'px';
    const g=cv.getContext('2d');g.setTransform(dp,0,0,dp,0,0);g.clearRect(0,0,w,h);if(!this.T.length)return;
    const pw=w-ch.priceScale('right').width(),ts=ch.timeScale();g.save();g.beginPath();g.rect(0,0,pw,h);g.clip();
    const xOf=t=>ts.timeToCoordinate(t),yOf=p=>cs.priceToCoordinate(p);
    const xRight=(()=>{const last=this.T[this.T.length-1],x=xOf(last);return x==null?pw:Math.min(pw,Math.max(x,pw))})();
    this.fv.forEach(f=>{const x0=xOf(f.t0+OFF);if(x0==null)return;const x1=f.mit&&f.t1!=null?xOf(f.t1+OFF):xRight;if(x1==null)return;
      const y1=yOf(f.top),y2=yOf(f.bot);if(y1==null||y2==null)return;
      const a=f.mit?0.08:0.20,col=f.type==='bull'?`rgba(38,194,129,${a})`:`rgba(255,77,79,${a})`;
      g.fillStyle=col;g.fillRect(Math.min(x0,x1),Math.min(y1,y2),Math.abs(x1-x0),Math.abs(y2-y1))});
    const specs=[['prem_high','Prem High','#26c281'],['open5_high','Open 5min High','#26c281'],['prev_high','Prev High','#26c281'],['prev_week_high','Prev Week High','#26c281'],['open5_low','Open 5min Low','#ff4d4f'],['prem_low','Prem Low','#ff4d4f'],['prev_low','Prev Low','#ff4d4f'],['prev_week_low','Prev Week Low','#ff4d4f']];
    const pills=[];
    specs.forEach(([k,lab,col])=>{const v=this.lv&&this.lv[k];if(v==null||v==='')return;const y=yOf(+v);if(y==null)return;pills.push({k,lab,col,v:+v,y})});
    pills.sort((a,b)=>a.y-b.y);
    for(let i=1;i<pills.length;i++){if(pills[i].y-pills[i-1].y<16)pills[i].y=pills[i-1].y+16}
    pills.forEach(p=>{g.strokeStyle=p.col;g.globalAlpha=.9;g.lineWidth=1;g.beginPath();g.moveTo(0,p.y+.5);g.lineTo(pw,p.y+.5);g.stroke();g.globalAlpha=1;
      const text=p.lab+' '+p.v.toFixed(2);g.font='11px -apple-system,sans-serif';const tw=g.measureText(text).width,ph=16,px=8,py=p.y-ph/2,bw=tw+12;
      g.fillStyle=p.col;g.beginPath();const r=8,x=px,y=Math.max(2,Math.min(h-ph-2,py));
      g.moveTo(x+r,y);g.arcTo(x+bw,y,x+bw,y+ph,r);g.arcTo(x+bw,y+ph,x,y+ph,r);g.arcTo(x,y+ph,x,y,r);g.arcTo(x,y,x+bw,y,r);g.closePath();g.fill();
      g.fillStyle='#fff';g.textBaseline='middle';g.fillText(text,x+6,y+ph/2+0.5)});
    g.restore()}};
function initChart(){const el=$('chart');ch=LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:'#1a1f2b'},textColor:'#bbb'},grid:{vertLines:{color:'#262c3a'},horzLines:{color:'#262c3a'}},timeScale:{timeVisible:true,secondsVisible:false,rightOffset:8},rightPriceScale:{scaleMargins:{top:.05,bottom:.25},minimumWidth:64},crosshair:{mode:0}});
bg=ch.addHistogramSeries({priceScaleId:'bg',priceLineVisible:false,lastValueVisible:false,autoscaleInfoProvider:()=>({priceRange:{minValue:0,maxValue:1}})});ch.priceScale('bg').applyOptions({scaleMargins:{top:0,bottom:0},visible:false});
cs=ch.addCandlestickSeries({upColor:'#26c281',downColor:'#ff4d4f',borderVisible:false,wickUpColor:'#26c281',wickDownColor:'#ff4d4f',priceLineVisible:true,priceLineStyle:1,priceLineColor:'#9aa',lastValueVisible:true});
vs=ch.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol',lastValueVisible:false,priceLineVisible:false});ch.priceScale('vol').applyOptions({scaleMargins:{top:.8,bottom:0}});
[9,21,50].forEach(n=>em[n]=ch.addLineSeries({color:MAC[n],lineWidth:n===9?2:2,priceLineVisible:false,lastValueVisible:true,crosshairMarkerVisible:false,title:'EMA'+n}));
vw=ch.addLineSeries({color:VWCOL,lineWidth:1,priceLineVisible:false,lastValueVisible:true,crosshairMarkerVisible:false,title:'VWAP'});
OV.init();
ch.subscribeCrosshairMove(p=>{if(!p.time)return;const t=new Date((p.time-OFF)*1000);$('et').textContent='美东 '+t.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour12:false})+' ET · 北京 '+t.toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
  if(!kd||!kd.bars.length)return;const i=kd.bars.findIndex(b=>b.t+OFF===p.time);MA.leg(i)})}
const MA={v:{},T:[],
  set(bars,Tfn){const c=bars.map(b=>b.c);this.T=bars.map(Tfn);[9,21,50].forEach(n=>this.v[n]=emaA(c,n));
    [9,21,50].forEach(n=>em[n].setData(this.T.map((t,i)=>({time:t,value:this.v[n][i]}))));this.leg(-1)},
  leg(i){if(!this.T.length)return;if(i<0||i>=this.T.length)i=this.T.length-1;const vw=kd&&kd.vwap?kd.vwap[i]:null;
    $('emlg').innerHTML=`<span style="color:${MAC[9]}">EMA9 ${this.v[9][i].toFixed(2)}</span> · <span style="color:${MAC[21]}">EMA21 ${this.v[21][i].toFixed(2)}</span> · <span style="color:${MAC[50]}">EMA50 ${this.v[50][i].toFixed(2)}</span> · <span style="color:${VWCOL}">VWAP ${vw==null?'--':(+vw).toFixed(2)}</span>`}};
let rc,rs,sc,sk,sd;
function sub(id){const c=LightweightCharts.createChart($(id),{autoSize:true,layout:{background:{color:'#1a1f2b'},textColor:'#bbb'},grid:{vertLines:{color:'#262c3a'},horzLines:{color:'#262c3a'}},timeScale:{visible:false,rightOffset:8},rightPriceScale:{minimumWidth:64},crosshair:{mode:0},handleScroll:false,handleScale:false});return c}
function hl(s,v,o){s.createPriceLine({price:v,color:o?'rgba(200,200,200,.6)':'rgba(200,200,200,.25)',lineStyle:2,lineWidth:1,axisLabelVisible:false})}
function initSub(){rc=sub('rsic');rs=rc.addLineSeries({color:'#f5c542',lineWidth:1,priceLineVisible:false,autoscaleInfoProvider:()=>({priceRange:{minValue:0,maxValue:100}})});hl(rs,70,1);hl(rs,30,1);hl(rs,50,0);
sc=sub('stc');const ap=()=>({priceRange:{minValue:0,maxValue:100}});sk=sc.addLineSeries({color:'#4fc3f7',lineWidth:1,priceLineVisible:false,autoscaleInfoProvider:ap});sd=sc.addLineSeries({color:'#ff8a65',lineWidth:1,priceLineVisible:false,autoscaleInfoProvider:ap});hl(sk,80,1);hl(sk,20,1);
ch.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r){rc.timeScale().setVisibleLogicalRange(r);sc.timeScale().setVisibleLogicalRange(r)}})}
function rsiCalc(c,n){const o=Array(c.length).fill(null);if(c.length<=n)return o;let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=n;l/=n;o[n]=l?100-100/(1+g/l):100;
for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=l?100-100/(1+g/l):100}return o}
function sma(a,n){return a.map((v,i)=>{if(v==null||i<n-1)return null;let s=0;for(let j=i-n+1;j<=i;j++){if(a[j]==null)return null;s+=a[j]}return s/n})}
function stoch(r,n){return r.map((v,i)=>{if(v==null||i<n-1)return null;const w=r.slice(i-n+1,i+1);if(w.includes(null))return null;const lo=Math.min(...w),hi=Math.max(...w);return hi>lo?(v-lo)/(hi-lo)*100:50})}
function updSub(d){const T=d.bars.map(b=>b.t+OFF),r=rsiCalc(d.bars.map(b=>b.c),14),k=sma(stoch(r,14),3),dd=sma(k,3);
const ser=a=>T.map((t,i)=>a[i]==null?{time:t}:{time:t,value:a[i]});rs.setData(ser(r));sk.setData(ser(k));sd.setData(ser(dd));
const L=a=>{const v=a[a.length-1];return v==null?'--':v.toFixed(1)};$('rsil').innerHTML='RSI(14) <span style="color:#f5c542">'+L(r)+'</span> · 70/30';$('stl').innerHTML='StochRSI(14,14,3,3) <span style="color:#4fc3f7">K '+L(k)+'</span> <span style="color:#ff8a65">D '+L(dd)+'</span> · 80/20';
const lr=ch.timeScale().getVisibleLogicalRange();if(lr){rc.timeScale().setVisibleLogicalRange(lr);sc.timeScale().setVisibleLogicalRange(lr)}}
let sigKey=null;
function renderSigs(){const ml=((kd&&kd.mtf_signals)||[]).slice().reverse();if(!kd)return;$('sigs').innerHTML=ml.length?ml.map(s=>{const b=s.direction==='bullish';return `<div class="sig ${b?'bull':'bear'}"><b>策略：${esc(s.strategy||'新规则')}</b> · <b class="${b?'up':'down'}">${b?'▲ 买 CALL':'▼ 买 PUT'}</b> @ ${esc(s.price)}<br>时间：${esc(s.trigger_time_bj)}（北京）</div>`}).join(''):'暂无信号';
const k=ml.length?ml[0].trigger_time_bj+ml[0].direction:'';if(sigKey!==null&&k&&k!==sigKey){document.body.classList.remove('flash');void document.body.offsetWidth;document.body.classList.add('flash');beep();if(navigator.vibrate)navigator.vibrate([300,100,300])}sigKey=k}
function bjToTs(s){const m=String(s).match(/(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/);if(!m)return null;return Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5])/1000}
function setMarkers(){if(cs)cs.setMarkers([]);return}
async function loadK(){try{const d=await (await fetch(BASE+'/kline',{cache:'no-store',headers:{'ngrok-skip-browser-warning':'1'}})).json();if(!d.bars||!d.bars.length){$('kinfo').textContent='K线错误: '+d.error;return}kd=d;
const T=b=>b.t+OFF;cs.setData(d.bars.map(b=>({time:T(b),open:b.o,high:b.h,low:b.l,close:b.c})));
vs.setData(d.bars.map(b=>({time:T(b),value:b.v,color:b.c>=b.o?'rgba(38,194,129,.5)':'rgba(255,77,79,.5)'})));
bg.setData(d.bars.map(b=>({time:T(b),value:1,color:sessColor(b.t)})));
MA.set(d.bars,T);vw.setData(d.bars.map((b,i)=>{const v=d.vwap?d.vwap[i]:b.vwap;return v==null?{time:T(b)}:{time:T(b),value:+v}}));
OV.set(d.bars,d.levels||{});
updSub(d);setMarkers();if(!window._fit){window._fit=1;ch.timeScale().applyOptions({minBarSpacing:0.3});const n=d.bars.length;const fit=()=>{const w=$("chart").clientWidth-65;ch.timeScale().applyOptions({barSpacing:Math.max(0.3,w/(n+8))});ch.timeScale().scrollToRealTime()};fit();setTimeout(fit,500);setTimeout(()=>OV.draw(),600)}if(!$("et").textContent)$('et').textContent='交易日(美东) '+d.session_date_et+' · 时间轴为北京时间'+(DEMO?' · DEMO 演示信号':'')}catch(e){$('kinfo').textContent='K线加载失败 '+e}}
function liveBar(q){if(!kd||!kd.bars.length||!q||!q.last)return;const b=kd.bars[kd.bars.length-1],p=+q.last;if(q.trade_status&&!/Normal/i.test(q.trade_status))return;const now=Math.floor(Date.now()/60000)*60;if(now-b.t>=180)return;
cs.update({time:b.t+OFF,open:b.o,high:Math.max(b.h,p),low:Math.min(b.l,p),close:p})}
function tickCd(){const left=180-Math.floor(Date.now()/1000)%180,m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');if($('cd'))$('cd').textContent=m+':'+s}
if(window.LightweightCharts){initChart();initSub();loadK();setInterval(()=>{if(!window._kb){window._kb=1;Promise.resolve(loadK()).finally(()=>window._kb=0)}},1000);tickCd();setInterval(tickCd,250)}else $('chart').textContent='图表库加载失败';

function drawKL(){if(!cs||!KV)return;KL.forEach(l=>cs.removePriceLine(l));KL=[];const v=KV;const A=(p,c,t,st)=>{if(p!=null)KL.push(cs.createPriceLine({price:+p,color:c,lineWidth:1,lineStyle:st??2,axisLabelVisible:true,title:t+' - '+(+p).toFixed(2)}))};
 A(v.iv_p2,'#b388ff','隐含波动 +2σ');A(v.iv_p1,'#b388ff','隐含波动 +1σ');A(v.iv_m1,'#b388ff','隐含波动 -1σ');A(v.iv_m2,'#b388ff','隐含波动 -2σ');
 A(v.call_wall,'#ff4d4f','日内压力位',0);A(v.put_wall,'#26c281','日内支撑位',0);A(v.gamma_flip,'#ffd600','伽马场',0);A(v.max_pain,'#ffab00','多空分界线',1)}
let KV=null;
async function loadKL(){try{const v=await (await fetch(BASE+'/levels?s=QQQ',{cache:'no-store',headers:{'ngrok-skip-browser-warning':'1'}})).json();if(v.pending||v.retry){setTimeout(loadKL,4000);return}if(v.has_options){KV=v;drawKL()}}catch(e){setTimeout(loadKL,10000)}}
loadKL();setInterval(loadKL,120000);
poll();setInterval(poll,1000);
</script></body></html>
